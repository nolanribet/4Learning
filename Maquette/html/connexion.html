<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4Learning - Connexion</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

    <div class="login-layout">
        <div class="login-left">
            <img src="../img/logo_horizontale.png" alt="4Learning Logo" class="login-left-logo">
            <p>La plateforme d'entraide par les étudiants, pour les étudiants de l'USMB.</p>
            <p style="margin-top: 20px; color: var(--text-muted);">Rejoins la communauté L1/L2 et valide ton semestre ensemble.</p>
        </div>

        <div class="login-right">
            <div class="login-form">
                <h2>Connexion</h2>
                <form action="index.html">
                    <div class="form-group">
                        <label for="email">Adresse mail universitaire (@etu.univ-smb.fr)</label>
                        <input type="email" id="email" placeholder="prenom.nom@etu.univ-smb.fr" required>
                    </div>
                    <div class="form-group">
                        <label for="password">Mot de passe</label>
                        <input type="password" id="password" placeholder="••••••••" required>
                    </div>
                    <button type="submit" class="btn btn-primary">Se connecter</button>
                </form>
                <p style="text-align: center; margin-top: 20px; font-size: 14px; color: var(--text-muted);">
                    Nouveau ici ? <a href="#" style="color: var(--primary); font-weight: 600;">S'inscrire</a>
                </p>
            </div>
        </div>
    </div>

</body>
</html>
